user_description: I lead a group focussed on Environmental and Resource Geophysics. I'm excited about how we can harness the power of nascent instrumentation and compute advances to shed light on environmental systems (e.g. glaciers) and resource exploration (particularly critical minerals). Originally a physicist/engineer, I am particularly passionate about the transfer of knowledge and expertise between academia and industry. Although the risks and motivations are different in each sector, we often face shared technical challenges that I believe are most efficiently overcome by close interaction with one another.
